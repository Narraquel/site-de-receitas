<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>receitas Ana Raquel</title>
    
</head>    
<body>
    <h1>Receitas da Ana Raquel</h1>
    
    <header>Doces</header>
    
    <div class="nome_da_receita">  
        </h2>Biscoito outra coisa</h2>
        <img src="FOTOS/biscoito_amanteigado" alt="biscoito_amanteigado">
    </div>
    <div class="instrucoes"> 
        <h3><strong>Ingredientes</strong></h3>
        <h4>100g de Amido de Milho</h4>
        <h4>50g de Margarina ou Manteiga</h4>
        <h4>1 gema</h4>
    </div>
    
    <div class="nome_da_receita">
        <h2>Bolo de Chocolate</h2>
        <img src="FOTOS/bolo_de_chocolate" alt="bolo_de_chocolate">
    </div>
    <div class="instrucoes">
        <h3><strong>Ingredientes</strong></h3>
        <h4>3 ovos</h4>
        <h4>1 xicara e meia do mix de farinha</h4>
        <h4>1/2 xícara de cacau em pó</h4>
        <h4>1 xícara de açúcar</h4>
        <h4>1/2 xícara de óleo</h4>
    </div>
